name: Web Bluetooth UI mock tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'test_browser.py'
      - '.github/workflows/web-ble-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'test_browser.py'
      - '.github/workflows/web-ble-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser mock BLE scan and GATT tests
        run: python -B test_browser.py
